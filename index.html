<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Tic Tac Toe (Readable Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .cell {
            width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s;
        }
        .cell:hover { background-color: #f0f0f0; }
        @media (prefers-color-scheme: dark) {
            body { background-color: #1a202c; color: #e2e8f0; }
            .cell { background-color: #2d3748; border-color: #4a5568; }
            .cell:hover { background-color: #4a5568; }
            .btn-primary { background-color: #4299e1; color: white; }
            .btn-secondary { background-color: #4a5568; color: white; }
            .input-field { background-color: #2d3748; border-color: #4a5568; color: white; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white dark:bg-gray-800 shadow-xl rounded-lg p-6 md:p-8">
        <h1 class="text-3xl font-bold text-center text-blue-600 dark:text-blue-400 mb-6">Online Tic Tac Toe</h1>

        <div class="mb-4 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
            <p class="text-sm">Your User ID: <code id="userId" class="font-mono text-xs break-all">Connecting...</code></p>
        </div>

        <div id="gameSetup" class="space-y-4">
            <button id="createGameBtn" class="w-full btn-primary font-semibold py-3 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">
                Create New Game
            </button>
            <hr class="border-gray-300 dark:border-gray-600">
            <div class="flex space-x-2">
                <input type="text" id="gameIdInput" placeholder="Enter Game ID to join" class="input-field flex-grow px-3 py-2 border border-gray-300 rounded-lg">
                <button id="joinGameBtn" class="btn-secondary font-semibold py-2 px-4 rounded-lg shadow transition-transform transform hover:scale-105">
                    Join
                </button>
            </div>
        </div>

        <div id="gameArea" class="hidden">
            <div class="mb-4 p-3 bg-blue-100 dark:bg-gray-700 rounded-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-semibold">Game ID: <code id="gameIdDisplay" class="font-mono text-blue-800 dark:text-blue-300 break-all"></code></p>
                        <p class="text-xs text-gray-600 dark:text-gray-400">(Share this ID with a friend)</p>
                    </div>
                    <button id="copyGameIdBtn" class="btn-secondary font-semibold py-2 px-3 rounded-lg shadow text-sm">Copy</button>
                </div>
            </div>

            <div id="statusMessage" class="text-center font-semibold text-lg mb-4 h-6"></div>
            <div id="board" class="grid grid-cols-3 gap-2 mx-auto w-max bg-gray-300 dark:bg-gray-600 p-2 rounded-lg"></div>
            <button id="resetGameBtn" class="w-full mt-6 btn-secondary font-semibold py-3 px-4 rounded-lg shadow hidden">Play Again</button>
        </div>
        
        <div id="messageModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-sm text-center">
                <p id="messageText" class="text-lg mb-4"></p>
                <button id="closeModalBtn" class="btn-primary py-2 px-6 rounded-lg">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAn2i82duN5JXQBjwumZSyA2XQhis9D8gU",
            authDomain: "ttt-project-d917a.firebaseapp.com",
            projectId: "ttt-project-d917a",
            storageBucket: "ttt-project-d917a.firebasestorage.app",
            messagingSenderId: "589040647816",
            appId: "1:589040647816:web:b61e4ebb628ec49122e93d",
            measurementId: "G-N822752WXM"
        };

        // --- INITIALIZATION ---
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const database = getFirestore(app); // Renamed from 'db'
        const auth = getAuth(app);

        let currentUserId, activeGameId; // Renamed from 'userId', 'gameId'
        let stopGameListener = null;     // Renamed from 'gameUnsubscribe'

        // --- UI ELEMENTS ---
        // Renamed 'els' to 'uiElements'
        const uiElements = {
            createBtn: document.getElementById('createGameBtn'),
            joinBtn: document.getElementById('joinGameBtn'),
            resetBtn: document.getElementById('resetGameBtn'),
            copyBtn: document.getElementById('copyGameIdBtn'),
            closeModalBtn: document.getElementById('closeModalBtn'),
            gameIdInput: document.getElementById('gameIdInput'),
            gameSetup: document.getElementById('gameSetup'),
            gameArea: document.getElementById('gameArea'),
            gameIdDisplay: document.getElementById('gameIdDisplay'),
            statusMessage: document.getElementById('statusMessage'),
            boardContainer: document.getElementById('board'),
            userIdDisplay: document.getElementById('userId'),
            modal: document.getElementById('messageModal'),
            modalText: document.getElementById('messageText')
        };

        // --- UTILITIES ---
        const showMessage = (text) => { 
            uiElements.modalText.textContent = text; 
            uiElements.modal.classList.remove('hidden'); 
        };
        
        const closeModal = () => uiElements.modal.classList.add('hidden');
        
        const copyGameIdToClipboard = () => {
            if (!activeGameId) return;
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = activeGameId;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            try { 
                document.execCommand('copy'); 
                uiElements.copyBtn.textContent = 'Copied!'; 
                setTimeout(() => uiElements.copyBtn.textContent = 'Copy', 2000); 
            } catch (error) { 
                showMessage("Manual copy required."); 
            }
            document.body.removeChild(tempTextArea);
        };

        // --- GAME LOGIC ---

        const renderBoard = (boardState) => {
            uiElements.boardContainer.innerHTML = '';
            
            // 'cellContent' is 'X', 'O', or ''
            // 'index' is 0, 1, 2...
            boardState.forEach((cellContent, index) => {
                const cellDiv = document.createElement('div');
                cellDiv.className = `cell bg-white dark:bg-gray-800 rounded ${cellContent === 'X' ? 'text-blue-500' : 'text-red-500'}`;
                cellDiv.textContent = cellContent;
                
                if (cellContent === '') {
                    cellDiv.onclick = () => handlePlayerMove(index);
                } else {
                    cellDiv.style.cursor = 'not-allowed';
                }
                uiElements.boardContainer.appendChild(cellDiv);
            });
        };

        const handlePlayerMove = async (clickedCellIndex) => {
            if (!activeGameId || !currentUserId) return;

            const gameDocumentReference = doc(database, "games", activeGameId);

            try {
                const gameSnapshot = await getDoc(gameDocumentReference);
                if (!gameSnapshot.exists()) return;
                
                const gameData = gameSnapshot.data();
                
                // Validation checks
                if (gameData.gameStatus !== 'active') return;
                if (gameData.board[clickedCellIndex] !== '') return; // Cell taken
                
                const mySymbol = gameData.playerX === currentUserId ? 'X' : 'O';
                if (gameData.currentPlayer !== mySymbol) { 
                    showMessage("Not your turn!"); 
                    return; 
                }

                // Create new board array
                const newBoardState = [...gameData.board];
                newBoardState[clickedCellIndex] = mySymbol;
                
                const winnerResult = checkForWinner(newBoardState);
                
                // Save to database
                await setDoc(gameDocumentReference, {
                    ...gameData, 
                    board: newBoardState,
                    currentPlayer: mySymbol === 'X' ? 'O' : 'X',
                    winner: winnerResult,
                    gameStatus: winnerResult ? 'finished' : 'active'
                });

            } catch (error) { 
                console.error(error); 
                if(error.code === 'permission-denied') showMessage("Permission Error: Please fix Firestore Rules in Firebase Console.");
                else showMessage("Move failed."); 
            }
        };

        // Renamed 'b' to 'boardState'
        const checkForWinner = (boardState) => {
            const winningCombinations = [
                [0,1,2],[3,4,5],[6,7,8], // Rows
                [0,3,6],[1,4,7],[2,5,8], // Cols
                [0,4,8],[2,4,6]          // Diagonals
            ];
            
            for (let combination of winningCombinations) {
                const [indexA, indexB, indexC] = combination;
                
                // Check if cell A has a value, AND matches B, AND matches C
                if (boardState[indexA] && 
                    boardState[indexA] === boardState[indexB] && 
                    boardState[indexA] === boardState[indexC]) {
                    return boardState[indexA]; // Returns 'X' or 'O'
                }
            }
            
            // Easier to read: "Does every cell have content?"
            const isDraw = boardState.every(cellContent => cellContent !== '');
            return isDraw ? 'Draw' : null;
        };

        const updateGameUI = (gameData) => {
            if (!gameData) { 
                showSetupScreen(); 
                return; 
            }
            
            renderBoard(gameData.board);
            uiElements.resetBtn.classList.add('hidden');
            
            const mySymbol = gameData.playerX === currentUserId ? 'X' : 'O';
            
            if (gameData.gameStatus === 'waiting') {
                uiElements.statusMessage.textContent = 'Waiting for opponent...';
            } else if (gameData.gameStatus === 'active') {
                uiElements.statusMessage.textContent = gameData.currentPlayer === mySymbol ? "Your Turn!" : "Opponent's Turn...";
            } else {
                // Game Finished
                if (gameData.winner === 'Draw') {
                    uiElements.statusMessage.textContent = "Draw!";
                } else if (gameData.winner === mySymbol) {
                    uiElements.statusMessage.textContent = "You Win!";
                } else {
                    uiElements.statusMessage.textContent = "You Lose.";
                }
                uiElements.resetBtn.classList.remove('hidden');
            }
        };

        const startListeningToGame = (gameIdToListen) => {
            if (stopGameListener) stopGameListener(); // Stop listening to old game
            
            // onSnapshot returns a function that stops the listener when called
            stopGameListener = onSnapshot(doc(database, "games", gameIdToListen), 
                (snapshot) => {
                    if (snapshot.exists()) {
                        updateGameUI(snapshot.data());
                    } else {
                        showSetupScreen();
                    }
                },
                (error) => { 
                    console.error(error); 
                    showMessage("Connection lost."); 
                }
            );
        };

        const showSetupScreen = () => { 
            uiElements.gameSetup.classList.remove('hidden'); 
            uiElements.gameArea.classList.add('hidden'); 
            uiElements.gameIdInput.value = ''; 
            activeGameId = null; 
        };
        
        const showGameScreen = (id) => { 
            uiElements.gameSetup.classList.add('hidden'); 
            uiElements.gameArea.classList.remove('hidden'); 
            uiElements.gameIdDisplay.textContent = id; 
        };

        // --- BUTTON ACTIONS ---
        
        uiElements.createBtn.onclick = async () => {
            try {
                const newGameReference = await addDoc(collection(database, "games"), {
                    board: Array(9).fill(''), 
                    playerX: currentUserId, 
                    playerO: null,
                    currentPlayer: 'X', 
                    gameStatus: 'waiting', 
                    winner: null, 
                    createdAt: new Date().toISOString()
                });
                
                activeGameId = newGameReference.id; 
                startListeningToGame(activeGameId); 
                showGameScreen(activeGameId);
                
            } catch (error) { 
                console.error(error);
                if(error.code === 'permission-denied') showMessage("Permission Denied! You must set Firestore Rules to 'allow read, write: if true;'");
                else showMessage("Failed to create game.");
            }
        };

        uiElements.joinBtn.onclick = async () => {
            const idToJoin = uiElements.gameIdInput.value.trim();
            if (!idToJoin) return showMessage("Enter Game ID");
            
            const gameDocumentReference = doc(database, "games", idToJoin);
            
            try {
                const gameSnapshot = await getDoc(gameDocumentReference);
                if (!gameSnapshot.exists()) return showMessage("Game not found");
                
                const gameData = gameSnapshot.data();
                
                if (gameData.playerO && gameData.playerO !== currentUserId) {
                    return showMessage("Game full");
                }
                
                // If I am not Player X, and Player O is empty, I become Player O
                if (gameData.playerX !== currentUserId && !gameData.playerO) {
                    await setDoc(gameDocumentReference, { 
                        ...gameData, 
                        playerO: currentUserId, 
                        gameStatus: 'active' 
                    });
                }
                
                activeGameId = idToJoin; 
                startListeningToGame(activeGameId); 
                showGameScreen(activeGameId);
                
            } catch (error) { 
                showMessage("Failed to join."); 
            }
        };

        uiElements.resetBtn.onclick = async () => {
            if(!activeGameId) return;
            const gameDocumentReference = doc(database, "games", activeGameId);
            const gameSnapshot = await getDoc(gameDocumentReference);
            
            if(gameSnapshot.exists()) {
                await setDoc(gameDocumentReference, { 
                    ...gameSnapshot.data(), 
                    board: Array(9).fill(''), 
                    currentPlayer: 'X', 
                    gameStatus: 'active', 
                    winner: null 
                });
            }
        };

        uiElements.closeModalBtn.onclick = closeModal;
        uiElements.copyBtn.onclick = copyGameIdToClipboard;

        // --- AUTHENTICATION START ---
        onAuthStateChanged(auth, (user) => {
            if (user) { 
                currentUserId = user.uid; 
                uiElements.userIdDisplay.textContent = currentUserId; 
                uiElements.createBtn.disabled = false; 
                uiElements.joinBtn.disabled = false; 
            } else { 
                currentUserId = null; 
                uiElements.userIdDisplay.textContent = "Signing in..."; 
            }
        });
        
        signInAnonymously(auth).catch(error => showMessage("Auth Failed: Enable Anonymous Auth in Firebase Console."));

    </script>
</body>
</html>
